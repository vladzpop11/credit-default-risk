seed: 42

data:
  url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
  raw_dir: data/raw
  processed_dir: data/processed
  raw_file: default of credit card clients.xls
  # SHA-256 of raw_file as downloaded on 2026-10-18; data.py refuses any other file.
  sha256: 30c6be3abd8dcfd3e6096c828bad8c2f011238620f5369220bd60cfc82700933
  target: default
  test_size: 0.2

cv:
  n_splits: 5

paths:
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

# Chosen at the step 4 checkpoint (see reports/cv_results.md).
model:
  name: xgboost
  exclude_features: [SEX, MARRIAGE, AGE]
  params:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8

# Cost assumption for the decision threshold: missing a defaulter (false negative)
# costs 5 times as much as wrongly flagging a good client (false positive).
threshold:
  cost_fn: 5
  cost_fp: 1

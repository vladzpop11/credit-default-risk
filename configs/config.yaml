seed: 42

data:
  url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
  raw_dir: data/raw
  processed_dir: data/processed
  raw_file: default of credit card clients.xls
  # SHA-256 of raw_file as downloaded on 2026-10-18; data.py refuses any other file.
  sha256: 30c6be3abd8dcfd3e6096c828bad8c2f011238620f5369220bd60cfc82700933
  target: default
  test_size: 0.2
  # SHA-256 of the saved split (data/processed/*_ids.csv); split.py refuses any other split,
  # so a change in scikit-learn's splitting cannot silently produce a different test set.
  split_sha256:
    train: c84469a7456b3a9edab8344eb94fc441604f111f5e1a4c1f3ff7ee58eaeb48cf
    test: 74c0030710bee9941808e10456bdff0f05321e6ce7162a75fbdf2e1aba30ca75

cv:
  n_splits: 5

paths:
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

# Chosen at the step 4 checkpoint (see reports/cv_results.md).
model:
  name: xgboost
  exclude_features: [SEX, MARRIAGE, AGE]
  params:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8

# Cost assumption for the decision threshold: missing a defaulter (false negative)
# costs 5 times as much as wrongly flagging a good client (false positive).
threshold:
  cost_fn: 5
  cost_fp: 1

# The evaluated model, published as a GitHub release asset. make fetch-model downloads it
# and checks it against the SHA-256 in reports/test_metrics.json before it is used.
release:
  model_url: https://github.com/vladzpop11/credit-default-risk/releases/download/model-v2/model.joblib

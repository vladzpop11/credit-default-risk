[project]
name = "credit-default-risk"
version = "0.1.0"
description = "Credit card default risk model: scikit-learn pipeline, cost-based threshold, FastAPI service in Docker"
readme = "README.md"
authors = [
    { name = "Vladzpop", email = "118611911+Vladzpop@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1 ; sys_platform != 'linux'",
    "xgboost-cpu>=3.4.1 ; sys_platform == 'linux'",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

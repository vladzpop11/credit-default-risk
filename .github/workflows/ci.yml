name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"  # every uv command must match uv.lock exactly
    steps:
      # Actions are pinned by commit SHA; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - run: uv sync

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --no-emit-project --all-groups > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      # Download (SHA-256 verified) and split first, so the tests that need the real
      # split also run.
      - run: make data split

      - run: make check

      # Retrain from the public source and check the result is within tolerance of the
      # evaluated model. Linux and macOS builds of xgboost differ slightly, so the CI
      # model is a reproducibility check, not the released artifact.
      - run: make train

      - run: make reproduce-check

      # Behavioural tests (invariance, direction, latency) need a trained model, so
      # `make check` above skips them; run them on the model just trained.
      - run: make test-model

      # The published artifact: download the evaluated model from the GitHub release,
      # check it is the file the recorded results describe, and test it.
      - run: make fetch-model

      - run: make verify

      - run: make test-model

      # Build the image with the evaluated model and check it serves; the image is not
      # published.
      - run: make docker-build

      - run: make docker-smoke

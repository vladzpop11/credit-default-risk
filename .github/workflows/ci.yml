name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"

      - run: uv sync --frozen

      - run: make check

      - run: docker build -t credit-default-risk:ci .
